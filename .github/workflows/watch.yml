name: BTC threshold watch

# Why this runs off the Mac: the laptop sleeps (sleep 15, womp 0) and launchd
# interval jobs do not fire while it is asleep. The daily 09:10 job still owns
# the full analysis; this only watches the two price-driven switches.
#
# Caveat worth knowing: GitHub's scheduled runs are best-effort and are often
# delayed well past the cron minute under load. Treat 15 minutes as "usually
# within ~30", not a guarantee. It cannot miss a wick regardless, because
# watch.py reads the DAY'S low rather than spot.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check thresholds
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 ops/watch.py

      - name: Persist state
        # The dedup state is the only thing standing between one alert and the
        # same alert every 15 minutes, so it has to outlive the runner.
        run: |
          if [ -n "$(git status --porcelain ops/watch_state.json)" ]; then
            git config user.name  "btc-cycle-watch"
            git config user.email "noreply@users.noreply.github.com"
            git add ops/watch_state.json
            git commit -m "watch: state $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "state unchanged"
          fi
